[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epicevents"
version = "0.1.0"
description = "Epic Events internal CRM (command-line application)"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "click>=8.0",
    "passlib>=1.7",
    "argon2-cffi>=25.1",
     "PyJWT>=2.15"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
include = ["epicevents*"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]